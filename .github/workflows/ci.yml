name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2  # no major tag v10
      - name: Check formatting and lint (clang-format, ruff)
        run: make check

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure (without OpenCL, warnings as errors)
        run: cmake -S . -B build -DUSE_OPENCL=0 -DCMAKE_CXX_FLAGS=-Werror
      - name: Build
        run: cmake --build build -j
      - name: Test
        working-directory: build
        run: ctest --output-on-failure

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.9
      - name: Build demos
        run: make build_wasm
