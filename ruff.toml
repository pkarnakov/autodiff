line-length = 120
target-version = "py312"

[lint]
select = [
    "E",  # Style errors
    "W",  # Style warnings
    "F",  # Logical errors
    "I",  # Import sorting
]
ignore = [
    "E741",  # Ambiguous variable name
    "E402",  # Module level import not at top of file
    "E501",  # Line too long
]

[format]
quote-style = "double"
